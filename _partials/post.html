<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{TITLE}} | Semil Shah</title>
  <meta name="description" content="{{DESCRIPTION}}"/>
  <link rel="canonical" href="{{CANONICAL}}"/>
  <meta property="og:title" content="{{TITLE}}"/>
  <meta property="og:description" content="{{DESCRIPTION}}"/>
  <meta property="og:url" content="{{CANONICAL}}"/>
  <meta property="og:type" content="article"/>
  <meta property="og:image" content="{{OGIMAGE}}"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:site" content="@semshah143"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: {
          primary: '#9e3c00', 'primary-container': '#ff7936', 'on-primary': '#fff0ea',
          surface: '#f6f6f6', 'surface-container-low': '#f1f1f1', 'surface-container': '#e8e8e8',
          'surface-container-lowest': '#ffffff', 'surface-container-high': '#e2e2e2',
          'surface-container-highest': '#dddddd', 'on-surface': '#2f2f2f',
          'on-surface-variant': '#5b5b5b', outline: '#777777', 'outline-variant': '#adadad',
          'inverse-surface': '#0e0e0e', 'primary-dim': '#8b3400',
        },
        borderRadius: { DEFAULT: '0px', lg: '0px', xl: '0px', full: '9999px' },
        fontFamily: { headline: ['Epilogue', 'sans-serif'], body: ['Inter', 'sans-serif'], label: ['Inter', 'sans-serif'] },
      }}
    }
  </script>
  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    body { background-color: #f6f6f6; color: #2f2f2f; -webkit-font-smoothing: antialiased; }
    #post-body h2 { font-family: 'Epilogue', sans-serif; font-weight: 900; text-transform: uppercase; letter-spacing: -0.02em; font-size: 1.875rem; color: #2f2f2f; margin-top: 4rem; margin-bottom: 2rem; }
    #post-body h3 { font-family: 'Epilogue', sans-serif; font-weight: 900; text-transform: uppercase; font-size: 1.25rem; color: #2f2f2f; margin-top: 2rem; margin-bottom: 1rem; }
    #post-body p { margin-bottom: 2rem; line-height: 1.8; }
    #post-body blockquote { font-family: 'Epilogue', sans-serif; font-weight: 900; text-transform: uppercase; font-size: clamp(2rem, 5vw, 4.5rem); line-height: 0.95; letter-spacing: -0.02em; color: #2f2f2f; margin: 4rem 0; font-style: normal; }
    #post-body ul { margin-bottom: 2rem; padding-left: 1.5rem; list-style: disc; }
    #post-body ol { margin-bottom: 2rem; padding-left: 1.5rem; list-style: decimal; }
    #post-body li { margin-bottom: 0.75rem; line-height: 1.7; }
    #post-body a { color: #9e3c00; text-decoration: underline; }
    #post-body img { width: 100%; margin: 2rem 0; }
    #post-body strong { font-weight: 700; }
    #post-body table { width: 100%; border-collapse: collapse; margin: 2rem 0; font-size: 0.9rem; }
    #post-body th, #post-body td { border: 1px solid #adadad; padding: 0.75rem 1rem; text-align: left; }
    #post-body th { background: #e8e8e8; font-family: 'Epilogue', sans-serif; font-weight: 800; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; }
  </style>
  <script type="application/ld+json">{{SCHEMA}}</script>
</head>
<body class="font-body">

{{NAV}}

<main class="pt-40 pb-24 px-8">
  <article class="max-w-3xl mx-auto">
    <a href="{{BASE}}insights.html" class="font-body text-[10px] tracking-widest uppercase text-black/40 hover:text-[#9e3c00] underline-offset-4 hover:underline">&larr; All Insights</a>
    <p class="font-body text-[10px] tracking-widest uppercase text-[#9e3c00] mt-8 mb-4">{{CATEGORY}} &middot; <time datetime="{{DATE_ISO}}">{{DATE_HUMAN}}</time></p>
    <h1 class="font-headline font-black uppercase tracking-tighter leading-[0.95] text-[clamp(2.25rem,6vw,4.5rem)] text-black mb-8">{{TITLE}}</h1>
    <p class="font-body text-lg leading-relaxed text-black/60 mb-16 pb-16 border-b border-black/10">{{DESCRIPTION}}</p>
    <div id="post-body">
{{BODY}}
    </div>
    <div class="mt-24 pt-12 border-t border-black/10 flex flex-col md:flex-row justify-between gap-8 items-start md:items-center">
      <div>
        <p class="font-headline font-black uppercase tracking-tighter text-2xl text-black">Want this done on your site?</p>
        <p class="font-body text-sm text-black/60 mt-2">SEO consulting and fractional growth leadership, Toronto &amp; remote.</p>
      </div>
      <a href="{{BASE}}contact.html" class="font-headline font-black uppercase tracking-tighter text-sm text-white bg-[#9e3c00] px-8 py-4 hover:bg-[#8b3400] transition-colors whitespace-nowrap">Book a Call</a>
    </div>
  </article>
</main>

{{FOOTER}}

</body>
</html>
